<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Record</title>
    <style>
        /* Style for body to center content and set background color */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Full viewport height */
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4; /* Light gray background */
        }
        /* Style for the container to hold the form */
        .container {
            background-color: #fff; /* White background for the form */
            padding: 20px;
            border-radius: 8px; /* Rounded corners */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Subtle shadow */
            width: 300px; /* Fixed width for the form */
        }
        /* Style for form groups (label and input pairs) */
        .form-group {
            margin-bottom: 15px;
        }
        /* Style for form labels */
        label {
            display: block;
            margin-bottom: 5px;
        }
        /* Style for text and email inputs */
        input[type="text"],
        input[type="email"] {
            width: 100%; /* Full width of the container */
            padding: 8px;
            box-sizing: border-box; /* Include padding in width calculation */
        }
        /* Style for gender selection */
        .gender-group {
            display: flex;
            align-items: center;
        }
        .gender-group .gender-option {
            display: flex;
            align-items: center;
            margin-right: 15px; /* Space between gender options */
        }
        .gender-group .gender-option input {
            margin-right: 5px; /* Space between radio button and label */
        }
        .gender-group label {
            margin-bottom: 0;
        }
        /* Style for submit button */
        button {
            width: 100%; /* Full width of the container */
            padding: 10px;
            background-color: #007BFF; /* Blue background */
            color: #fff; /* White text */
            border: none;
            border-radius: 5px; /* Rounded corners */
            cursor: pointer;
        }
        /* Hover effect for the button */
        button:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }
        /* Style for displaying error messages */
        ul {
            padding: 0;
            list-style-type: none; /* Remove bullet points */
            color: red; /* Red color for error messages */
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Edit Record</h2>

        <!-- Display flashed messages (e.g., validation errors) -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul>
            {% for message in messages %}
            <li>{{ message }}</li>  <!-- Display each flashed message -->
            {% endfor %}
        </ul>
        {% endif %}
        {% endwith %}

        <!-- Form to edit an existing record -->
        <form action="{{ url_for('edit', id=record.idName) }}" method="post" onsubmit="return validateForm()">
            <!-- First Name input with existing value pre-filled -->
            <div class="form-group">
                <label for="f_name">First Name:</label>
                <input type="text" id="f_name" name="f_name" value="{{ record.f_name }}" required>
            </div>
            <!-- Middle Name input with existing value pre-filled -->
            <div class="form-group">
                <label for="m_name">Middle Name:</label>
                <input type="text" id="m_name" name="m_name" value="{{ record.m_name }}">
            </div>
            <!-- Last Name input with existing value pre-filled -->
            <div class="form-group">
                <label for="l_name">Last Name:</label>
                <input type="text" id="l_name" name="l_name" value="{{ record.l_name }}" required>
            </div>
            <!-- City selection with pre-selected value -->
            <div class="form-group">
                <label for="City_idCity">City:</label>
                <select id="City_idCity" name="City_idCity" required>
                    <option value="">Select City</option>
                    {% for city in cities %}
                    <option value="{{ city.idCity }}" {% if record.City_idCity == city.idCity %}selected{% endif %}>{{ city.PPC }}</option>
                    {% endfor %}
                </select>
            </div>
            <!-- Job selection with pre-selected value -->
            <div class="form-group">
                <label for="Job_idJob">Job:</label>
                <select id="Job_idJob" name="Job_idJob" required>
                    <option value="">Select Job</option>
                    {% for job in jobs %}
                    <option value="{{ job.idJob }}" {% if record.Job_idJob == job.idJob %}selected{% endif %}>{{ job['White color'] }}</option>
                    {% endfor %}
                </select>
            </div>
            <!-- Submit button -->
            <button type="submit" class="button">Update Record</button>
        </form>

        <!-- JavaScript function to validate form input before submission -->
        <script>
            function validateForm() {
                const firstName = document.getElementById('f_name').value;
                const middleName = document.getElementById('m_name').value;
                const lastName = document.getElementById('l_name').value;
                const city = document.getElementById('City_idCity').value;
                const job = document.getElementById('Job_idJob').value;
        
                let errors = [];
        
                // Check if required fields are filled
                if (!firstName || !lastName) {
                    errors.push("First and Last Name are required.");
                }
        
        
                // Validate gender selection
                if (!city) {
                    errors.push("City is required.");
                }
                if (!job) {
                    errors.push("Job is required.");
                }
        
                // No email or IP fields in this form; skip those validations.
        
                // Display errors if any
                if (errors.length > 0) {
                    alert(errors.join("\n")); // Show errors in an alert dialog
                    return false; // Prevent form submission
                }
        
                return true; // Allow form submission
            }
        </script>

    </div>
</body>
</html>
